name: CI Pipeline

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-package:
    name: Build, Test & Package Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Compile VS Code Extension
        run: npm run compile:extension

      - name: Run Monorepo Test Suites
        run: npm test

      - name: Validate Dataset & Ground Truth
        run: npm run dataset:validate

      - name: Package VS Code Extension (VSIX)
        run: npm run package:extension

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-aware-unit-test-generation-extension
          path: packages/extension/*.vsix
